name: design-refs

# Harvests Mobbin design-reference images on a runner with open internet and
# commits them to the branch, so the (network-fenced) design session can view
# them. Trigger manually or via API.
on:
  workflow_dispatch:
  push:
    branches: [claude/casting-director-app-50kd44]
    paths:
      - "scripts/harvest-mobbin.sh"
      - ".github/workflows/design-refs.yml"
      - "docs/design-refs/request.txt"

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/casting-director-app-50kd44
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm i playwright@1 >/dev/null
          npx playwright install --with-deps chromium
      - name: Harvest Mobbin reference images
        env:
          MOBBIN_COOKIE: ${{ secrets.MOBBIN_COOKIE }}
        run: node scripts/harvest-mobbin.mjs
      - name: Commit results
        run: |
          git config user.name "design-refs-harvest"
          git config user.email "actions@users.noreply.github.com"
          git add docs/design-refs/raw
          git diff --cached --quiet && echo "Nothing harvested" || {
            git commit -m "Harvest Mobbin design reference images (Actions runner)"
            git push
          }
